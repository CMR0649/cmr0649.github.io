# 站点配置文件

# 导入主题
theme: jekyll-theme-chirpy

# 网页语言 › http://www.lingoes.net/en/translator/langcode.htm
# 如果与 `_data/locales` 文件夹中的某个文件同名，布局语言也会随之更改，
# 否则，布局语言将使用默认值 'en'。
lang: zh

# 更改为你的时区 › https://zones.arilyn.cc
timezone: Asia/Shanghai

# jekyll-seo-tag 设置 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: ifxog的小站 # 主标题

tagline:  # 它将显示为副标题

description: >- # 用于 SEO 元数据和 Atom 订阅源
  

# 填写你站点的协议和主机名。
# 例如 'https://username.github.io'，注意不要以 '/' 结尾。
url: "https://cmr0649.github.io"

github:
  username:  # 更改为你的 GitHub 用户名

twitter:
  username:  # 更改为你的 Twitter 用户名

social: ifxog
  # 更改为你的全名。
  # 它将显示为文章的默认作者以及页脚的版权所有者
  name: ifxog
  email:  # 更改为你的电子邮件地址
  fediverse_handle: 
  links:
    # 第一个元素用作版权所有者的链接
    # https://twitter.com/username # 更改为你的 Twitter 主页
    # https://github.com/username # 更改为你的 GitHub 主页
    # 取消下方注释以添加更多社交链接
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 站点验证设置
webmaster_verifications:
  google: # 填写你的 Google 验证码
  bing: # 填写你的 Bing 验证码
  alexa: # 填写你的 Alexa 验证码
  yandex: # 填写你的 Yandex 验证码
  baidu: # 填写你的 Baidu 验证码
  facebook: # 填写你的 Facebook 验证码

# ↑ --------------------------
# `jekyll-seo-tag` 设置结束

# 网站分析设置
analytics:
  google:
    id: # 填写你的 Google Analytics ID
  goatcounter:
    id: # 填写你的 GoatCounter ID
  umami:
    id: # 填写你的 Umami ID
    domain: # 填写你的 Umami 域名
  matomo:
    id: # 填写你的 Matomo ID
    domain: # 填写你的 Matomo 域名
  cloudflare:
    id: # 填写你的 Cloudflare Web Analytics 令牌
  fathom:
    id: # 填写你的 Fathom Site ID

# 页面浏览量设置
pageviews:
  provider: # 目前仅支持 'goatcounter'

# 首选颜色方案设置。
#
# 注意：保持为空将默认遵循系统偏好颜色，
# 并且侧边栏左下方会有一个切换开关，用于在深色和浅色主题之间切换。
#
# 可用选项：
#
#     light — 使用浅色方案
#     dark — 使用深色方案
#
theme_mode: # [light | dark]

# 媒体资源的 CDN 端点。
# 请注意，一旦分配了此项，CDN URL
# 将添加到所有以 '/' 开头的媒体资源（站点头像、文章图片、音频和视频文件）路径中
#
# 例如 'https://cdn.com'
cdn:

# 侧边栏的头像，支持本地或 CORS 资源
avatar:

# 用于 SEO `og:image` 元标签的全站社交预览图的 URL。
# 可以在前言部分通过自定义的 `page.image` 来覆盖此项。
social_preview_image: # 字符串，本地或 CORS 资源

# 布尔类型，文章目录的全局开关。
toc: true

actions:
  # 在每个文章页面显示“编辑此文章”操作以鼓励贡献。
  edit_post:
    enabled: false # 设置为 true 以显示“编辑此文章”操作。
    url: "" # 仓库基础 URL，例如 https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # 为编辑链接使用动态或静态 URL。
    # 如果 `static_url` 为 false，文章的路径将附加到上述 `url` 后面作为最终的编辑链接。
    # 如果希望 URL 保持不变，即每篇文章共享相同的编辑链接，则设置为 true。
    static_url: false # [ true | false ]

comments:
  # 文章评论系统的全局开关。保持为空意味着禁用。
  provider: # [disqus | utterances | giscus]
  # 各提供商的选项如下：
  disqus:
    shortname: # 填写 Disqus 的 shortname。 › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
  # utterances 设置 › https://utteranc.es/
  utterances:
    repo: # <gh-username>/<repo>
    issue_term: # < url | pathname | title | ...>
  # Giscus 选项 › https://giscus.app
  giscus:
    repo: # <gh-username>/<repo>
    repo_id:
    category:
    category_id:
    mapping: # 可选，默认值为 'pathname'
    strict: # 可选，默认值为 '0'
    input_position: # 可选，默认值为 'bottom'
    lang: # 可选，默认值为 `site.lang` 的值
    reactions_enabled: # 可选，默认值为 `1`

# 自托管静态资源，可选 › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # 布尔值，保持为空表示 false
    # 指定 Jekyll 环境，为空表示两者都适用
    # 仅在 `assets.self_host.enabled` 为 'true' 时有效
    env: # [development | production]

pwa:
  enabled: true # PWA 功能选项（可安装）
  cache:
    enabled: true # PWA 离线缓存选项
    # 此处定义的路径将被排除在 PWA 缓存之外。
    # 通常它的值是另一个与当前网站共享相同域名的网站的 `baseurl`。
    deny_paths:
      # - "/example"  # 匹配 `<SITE_URL>/example/*` 的 URL 将不会被 PWA 缓存

paginate: 10

baseurl: ""

# ------------ 不建议修改以下选项 ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 选项 › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 此处空字符串表示项目中的所有文件
      type: posts
    values:
      layout: post
      comments: true # 在文章中启用评论。
      toc: true # 在文章中显示目录列。
      # 除非你有足够的把握更新此项目中所有其他文章链接的代码，
      # 否则不要修改以下参数。
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # 参见 `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
